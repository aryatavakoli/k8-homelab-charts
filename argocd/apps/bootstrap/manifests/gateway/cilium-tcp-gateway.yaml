apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-tcp-gateway
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - protocol: TCP
      port: 25565
      name: minecraft-gateway
      allowedRoutes:
        kinds:
        - kind: TCPRoute
        namespaces:
          from: All