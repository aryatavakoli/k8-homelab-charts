apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: contour-http-gateway
  namespace: projectcontour
  annotations:
    cert-manager.io/issuer: cloudflare-letsencrypt-prod
spec:
  gatewayClassName: contour
  listeners:
    - protocol: HTTPS
      port: 443
      name: https-gateway
      hostname: "*.aryat.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloudflare-cert
      allowedRoutes:
        kinds:
        - kind: HTTPRoute
        namespaces:
          from: All