apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway
  namespace: argocd
spec:
  project: project-bootstrap
  sources:
    - repoURL: ghcr.io/nginx/charts/
      path: nginx-gateway-fabric
      chart: nginx-gateway-fabric
      targetRevision: 1.16.2
      helm:
        releaseName: nginx-gateway
        valueFiles:
          - $values/argocd/apps/bootstrap/values/nginx-gateway-values.yaml
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      path: argocd/apps/bootstrap/manifests/nginx-gateway
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nginx-gateway
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true