apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
spec:
  project: project-bootstrap
  sources:
    - repoURL: oci://ghcr.io/nginx/charts/
      chart: nginx-gateway-fabric
      targetRevision: 1.15.2
      helm:
        releaseName: nginx-gateway
        valueFiles:
          - $repo/argocd/apps/bootstrap/values/nginx-gateway-values.yaml
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      path: argocd/apps/bootstrap/manifests/nginx-gateway
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nginx-gateway
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true