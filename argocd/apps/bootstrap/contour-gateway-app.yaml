apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: contour-gateway
  namespace: argocd
spec:
  project: project-bootstrap
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      path: contour
      chart: contour
      targetRevision: 20.0.3
      helm:
        releaseName: contour
        valueFiles:
          - $values/argocd/apps/bootstrap/values/contour-gateway-values.yaml
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      path: argocd/apps/bootstrap/manifests/contour-gateway
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: projectcontour
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true