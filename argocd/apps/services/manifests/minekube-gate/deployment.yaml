apiVersion: apps/v1
kind: Deployment
metadata:
  name: minekube-gate
  namespace: minecraft
spec:
  selector:
    matchLabels:
      app: minekube-gate
  template:
    metadata:
      labels:
        app: minekube-gate
    spec:
      containers:
      - image: ghcr.io/minekube/gate:latest
        name: gate
        ports:
        - containerPort: 25565
          name: minecraft
        volumeMounts:
        - mountPath: /config.yml
          name: config
          subPath: config.yml
      volumes:
      - configMap:
          name: minekube-gate-configmap
        name: config