apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: minekube-gate
  namespace: minecraft
spec:
  parentRefs:
    - name: tcp-gateway
      sectionName: minecraft-gateway
      namespace: gateway
      kind: Gateway
  hostnames:
    - "minekube-gate.aryat.io"
  rules:
     - backendRefs:
        - name: minekube-gate
          namespace: minecraft
          port: 25565