apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astroneer-vanilla
  namespace: argocd
spec:
  project: project-services
  sources:
    - repoURL: https://github.com/aryatavakoli/k8-homelab-charts
      targetRevision: HEAD
      path: argocd/apps/services/manifests/astroneer-server
  destination:
    server: "https://kubernetes.default.svc"
    namespace: astroneer
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
